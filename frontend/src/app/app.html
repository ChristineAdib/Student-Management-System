<div class="layout-container">
  <!-- Mobile Sidebar Backdrop -->
  @if (isMobileSidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeMobileSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside class="sidebar" [class.mobile-open]="isMobileSidebarOpen()">
    <div class="sidebar-brand">
      <div class="brand-crest">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-title">Academia</h1>
        <span class="brand-badge">Student Management</span>
      </div>
      <button type="button" class="sidebar-close-btn" (click)="closeMobileSidebar()" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">MAIN NAVIGATION</div>

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        (click)="closeMobileSidebar()"
      >
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a
        routerLink="/students"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
        (click)="closeMobileSidebar()"
      >
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </span>
        <span class="nav-label">Students Directory</span>
      </a>

      <a
        routerLink="/students/new"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileSidebar()"
      >
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </span>
        <span class="nav-label">Register Student</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="system-status-pill">
        <span class="status-indicator-dot"></span>
        <div class="status-meta">
          <span class="status-title">SQL Server Database</span>
          <span class="status-sub">Local Connection Active</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-wrapper">
    <!-- Top Header -->
    <header class="top-header">
      <div class="header-left">
        <button
          type="button"
          class="mobile-menu-toggle"
          (click)="toggleMobileSidebar()"
          aria-label="Toggle navigation menu"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="page-title-box">
          <h1 class="page-title">{{ currentPageTitle() }}</h1>
          <p class="page-subtitle">{{ currentPageSubtitle() }}</p>
        </div>
      </div>

      <div class="header-right">
        <div class="registrar-badge">
          <div class="avatar-circle">RO</div>
          <div class="user-meta">
            <span class="user-name">Registrar's Office</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Router Outlet Viewport -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global Toasts -->
  <app-toast></app-toast>
</div>
